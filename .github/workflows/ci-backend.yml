name: CI Backend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Limpiar instalación
        run: |
          cd backend
          rm -rf node_modules package-lock.json

      - name: Instalar dependencias del backend
        run: |
          cd backend
          npm ci

      - name: Ejecutar pruebas del backend
        run: |
          cd backend
          npm test

